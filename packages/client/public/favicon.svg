<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Space Miner: an asteroid with glowing ore breaking out of it, in a cyan orbit, in deep space -->
  <defs>
    <radialGradient id="space" cx="28%" cy="22%" r="90%">
      <stop offset="0" stop-color="#1d2c66" />
      <stop offset="0.55" stop-color="#0b1132" />
      <stop offset="1" stop-color="#05070f" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffb347" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rock" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#e8b47a" />
      <stop offset="0.5" stop-color="#a06640" />
      <stop offset="1" stop-color="#4a2c17" />
    </radialGradient>
    <linearGradient id="ore" x1="0" y1="1" x2="0.25" y2="0">
      <stop offset="0" stop-color="#ff8c1f" />
      <stop offset="0.35" stop-color="#ffc35c" />
      <stop offset="1" stop-color="#fffbe8" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40c4ff" stop-opacity="0.5" />
      <stop offset="0.55" stop-color="#a8ecff" />
      <stop offset="1" stop-color="#40c4ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#space)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.3" fill="none" stroke="#8fb4ff" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- stars -->
  <path d="M13 8.5l1.3 3.9 3.9 1.3-3.9 1.3-1.3 3.9-1.3-3.9-3.9-1.3 3.9-1.3z" fill="#fff" />
  <circle cx="53" cy="11" r="1.3" fill="#fff" opacity="0.9" />
  <circle cx="9" cy="52" r="1" fill="#bcd4ff" opacity="0.8" />

  <!-- the orbit behind the asteroid -->
  <g transform="rotate(-24 32 35)">
    <path d="M5 35a27 8.5 0 0 1 54 0" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.55" />
  </g>

  <!-- the asteroid, in the glow of its ore -->
  <circle cx="33" cy="33" r="25" fill="url(#halo)" />
  <path
    d="M34 13.5c8 .3 14.5 5.5 16.2 13 1.6 7-.4 14.5-6 19.2-5.8 4.8-14.4 5.6-20.8 2-6.2-3.4-9.4-10.4-8.3-17.4.8-5.4 3.4-9.6 7.6-12.6 3.4-2.6 7.2-4.3 11.3-4.2z"
    fill="url(#rock)"
  />
  <ellipse cx="24.5" cy="39" rx="4.2" ry="3.2" fill="#2e1b0e" opacity="0.75" />
  <ellipse cx="24" cy="38.4" rx="4.2" ry="3.2" fill="none" stroke="#e0a868" stroke-opacity="0.35" stroke-width="0.8" />
  <ellipse cx="40" cy="44" rx="2.6" ry="2" fill="#2e1b0e" opacity="0.7" />
  <ellipse cx="22.5" cy="26" rx="2" ry="1.6" fill="#2e1b0e" opacity="0.55" />

  <!-- the ore crystals breaking out of it -->
  <g filter="url(#glow)">
    <path d="M31 37 37.5 10 45 36z" fill="url(#ore)" />
    <path d="M25.5 38.5 26.5 21 34 37z" fill="url(#ore)" />
    <path d="M40.5 37.5 51 22.5 49 39z" fill="url(#ore)" />
  </g>
  <path d="M37.5 10 35.5 36.5" stroke="#fff" stroke-opacity="0.9" stroke-width="1.1" stroke-linecap="round" />
  <path d="M26.5 21 27.5 37.5" stroke="#fff" stroke-opacity="0.65" stroke-width="0.8" stroke-linecap="round" />
  <path d="M51 22.5 44 37.5" stroke="#fff" stroke-opacity="0.55" stroke-width="0.8" stroke-linecap="round" />

  <!-- the orbit in front of it -->
  <g transform="rotate(-24 32 35)">
    <path d="M59 35a27 8.5 0 0 1-54 0" fill="none" stroke="url(#ring)" stroke-width="3.6" stroke-linecap="round" />
  </g>
</svg>
